[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/susi", "apps/susi-cli", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal
susi-core = { path = "crates/core" }
susi-mcp = { path = "crates/mcp" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
glob = "0.3"
calamine = "0.37"
rust_xlsxwriter = "0.101"
clap = { version = "4", features = ["derive", "env"] }
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
rfd = "0.17"
log = "0.4"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
tempfile = "3"
sys-locale = "0.3"
# app icon: rendering (xtask icons) and embedding into the Windows executables
resvg = { version = "0.49", default-features = false }
ico = "0.6"
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
